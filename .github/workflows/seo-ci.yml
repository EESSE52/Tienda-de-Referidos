name: Validar módulo SEO

on:
  push:
    branches:
      - feat/contenido-seo-guias
  pull_request:
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - '.github/workflows/seo-ci.yml'

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
